    master.connect(ac.createDynamicsCompressor()).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);

// a soft, low, slowly breathing whoosh whose level follows how close he is to a hole

// No beat or chords — droplets, chirps, bubbles and boops scattered like a toy pond, with echo.
// Scheduled slightly ahead on a 16th-note grid (120 bpm) so timing stays tight.
const mtof = (m) => 440 * 2 ** ((m - 69) / 12);
const PENTA_HI = [72, 74, 76, 79, 81, 84, 86, 88, 91, 93];
const MUSIC_STEP = 60 / 120 / 4;
const music = { bus: null, echo: null, timer: 0, nextT: 0, level: -1 };
const bleep = (f, t, o = {}) => tone({ f0: f, dur: 0.09, vol: 0.02, at: t, out: music.echo, ...o });
const bubble = (t) => { const f = rand(700, 1100); tone({ f0: f, f1: f * rand(1.4, 1.9), dur: 0.12, vol: 0.015, vib: 30, vibHz: 14, at: t, out: music.echo }); };
function musicStep(t) {
  const r = Math.random();
  if (r < 0.12) { const f = mtof(pick(PENTA_HI)); tone({ f0: f, f1: f * 1.3, dur: 0.08, vol: 0.022, at: t, out: music.echo }); } // droplet
  else if (r < 0.15) { const f = rand(1200, 1800); bleep(f, t, { dur: 0.04 }); bleep(f * 1.5, t + 0.06, { dur: 0.04 }); }  // chirp
  else if (r < 0.19) for (let k = 0; k < 3; k++) bubble(t + k * 0.07);                                                    // bubbles
  else if (r < 0.205) tone({ f0: 220, f1: 160, dur: 0.18, vol: 0.04, at: t, out: music.echo });                           // boop
}
function startMusic() {
  if (music.timer || !ac) return;
  music.bus = ac.createGain();
  music.bus.gain.value = 0;
  music.bus.connect(master);
  // echo send for the melodic bits
  const d = ac.createDelay(1), fb = ac.createGain(), wet = ac.createGain(), lp = ac.createBiquadFilter();
  d.delayTime.value = 0.375; fb.gain.value = 0.32; wet.gain.value = 0.35; lp.type = 'lowpass'; lp.frequency.value = 2400;
  music.echo = ac.createGain();
  music.echo.connect(music.bus);
  music.echo.connect(d); d.connect(lp).connect(fb).connect(d); lp.connect(wet).connect(music.bus);
  music.nextT = ac.currentTime + 0.2;
  music.timer = setInterval(scheduleMusic, 50);
}
function scheduleMusic() {
  while (music.nextT < ac.currentTime + 0.25) {

}

const VENT_R = 1.2, VENT_REACH = VENT_R * 1.2, VENT_GONE = 18, VENT_LIFT = 170;
// a pit: flat two-tone hole. The opening is one hard-edged circle; inside, the floor is the same circle
// slid toward the camera, so a crescent of inner wall shows on the far side — reads as depth from any angle.
const PIT_VERT = /* glsl */`
  uniform float uCurve;
  uniform vec2 uCurveC;
  varying vec2 vP;
  void main() {
    vP = position.xz;
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vec2 cd = wp.xz - uCurveC;
    wp.y -= uCurve * dot(cd, cd);
    gl_Position = projectionMatrix * viewMatrix * wp;
  }`;
const PIT_FRAG = /* glsl */`
  uniform float uR, uGrain;
  uniform vec2 uOff;
  uniform vec3 uWall, uFloor;
  varying vec2 vP;
  float grainHash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  void main() {
    float aa = fwidth(length(vP)) * 0.6;
    float rim = length(vP) - uR;
    if (rim > aa) discard;
    float floorMask = 1.0 - smoothstep(-aa, aa, length(vP - uOff) - uR);
    vec3 c = mix(uWall, uFloor, floorMask);
    c += (grainHash(gl_FragCoord.xy) - 0.5) * uGrain;

const surfR = (y) => capR(y) * shapeK(y);

const lagW = new THREE.Vector3(), lagV = new THREE.Vector3(), lagL = new THREE.Vector3();

// poke ripples: rings travel over the bean from the poke point and a "gulp" bulge runs down each limb

const RIPPLE_C = 3.2, RIPPLE_K = 8;

// ---------- limbs: tubes rebuilt every frame, coloured to flow out of the body ----------
class Limb {
  constructor(parent, segs, radial) {
    Object.assign(this, { segs, radial, radius: 0.1 });
    this.colors = new Float32Array((segs + 1) * (radial + 1) * 3);
    this.mesh = new THREE.Mesh(new THREE.BufferGeometry(), grainy(new THREE.MeshBasicMaterial({ vertexColors: true })));
    this.mesh.castShadow = true;
    this.mesh.frustumCulled = false;
    parent.add(this.mesh);
  }
  setColors(from, to, blendEnd = 1) {
    const c = new THREE.Color();
    for (let i = 0; i <= this.segs; i++) {
      c.copy(from).lerp(to, smooth(clamp01(i / this.segs / blendEnd)));
      for (let j = 0; j <= this.radial; j++) c.toArray(this.colors, (i * (this.radial + 1) + j) * 3);
    }
  }
  set(points, pulse) {
    this.mesh.geometry.dispose();
    const curve = new THREE.CatmullRomCurve3(points);
    const g = new THREE.TubeGeometry(curve, this.segs, this.radius, this.radial, false);
    if (pulse) { // swell rings around the centreline where the gulp is passing
      const a = g.attributes.position.array;
      for (let i = 0; i <= this.segs; i++) {
        const b = pulse(i / this.segs);
        if (Math.abs(b) < 0.01) continue;
        curve.getPointAt(i / this.segs, tmp);
        for (let j = 0; j <= this.radial; j++) {
          const k = (i * (this.radial + 1) + j) * 3;
          a[k] = tmp.x + (a[k] - tmp.x) * (1 + b);
          a[k + 1] = tmp.y + (a[k + 1] - tmp.y) * (1 + b);
          a[k + 2] = tmp.z + (a[k + 2] - tmp.z) * (1 + b);
        }
      }
    }
    g.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
    this.mesh.geometry = g;
  }
}

class Noodle {
  constructor(side) {
    this.side = side; // -1 left, +1 right
    this.shoulderBase = new THREE.Vector3();
    this.shoulder = new THREE.Vector3();
    this.limb = new Limb(scene, ARM_SEGS, ARM_RADIAL);
    this.pos = []; this.prev = [];
    for (let i = 0; i < ARM_N; i++) {
      const p = new THREE.Vector3(side * (0.6 + i * 0.07), Math.max(0.1, BODY_Y - i * 0.1), 0);
      this.pos.push(p); this.prev.push(p.clone());
    }

  }
  build() {
    this.seg = S.armLength / (ARM_N - 1);
    const col = gradientAt(grad(), BODY_HALF, tmp.set(this.side * surfR(0), 0, 0.05));
    this.limb.radius = S.armThickness;
    this.limb.setColors(col, handMat.color, 0.75);
    this.hand.scale.setScalar(S.armThickness / 0.1);
  }
  step(dt) {
    const { pos, prev, seg } = this;
    const r = S.armThickness;
    // recomputed each step because the blob shape breathes
    this.shoulderBase.set(this.side * (surfR(0) - Math.max(0.08, r)), 0, 0.05);
    body.localToWorld(pos[0].copy(deform(this.shoulderBase, this.shoulder)));
    prev[0].copy(pos[0]);

    for (let i = 1; i < ARM_N; i++) {
      const p = pos[i], q = prev[i];
      tmp.subVectors(p, q).multiplyScalar(0.985);
      q.copy(p);
      p.add(tmp).addScaledVector(GRAV, dt * dt);
      const lift = ventLift(p.x, p.y, p.z, VENT_R * 2.2); // hole: shove up and whip about in gusts (arms catch a wider column)
      if (lift > 0) {
        p.y += lift * VENT_LIFT * (0.75 + 0.5 * Math.sin(t * 17 + i * 1.7)) * dt * dt;
        const gust = t * 9 + this.side * 2.1, k = (i / ARM_N) * 110; // tips whip hardest
        p.x += lift * (Math.sin(gust + i * 0.45) + 0.6 * Math.sin(gust * 2.3 - i * 0.3)) * k * dt * dt;
        p.z += lift * (Math.cos(gust * 1.3 + i * 0.5) + 0.6 * Math.cos(gust * 1.9 + i * 0.2)) * k * dt * dt;
      }
    }

    // shoulder stiffness: first few joints reach out sideways and a bit down
    // when dancing, the arms stiffen and wave up and down, alternating sides
    const wave = Math.sin(danceBeat + (this.side > 0 ? 0 : Math.PI));
    const out = tmp2.set(this.side, -0.55 + boogieA * (0.45 + 0.9 * wave), 0.15 + boogieA * 0.25)
      .normalize().applyQuaternion(body.getWorldQuaternion(_q));
    const stiff = S.armStiffness + boogieA * (0.5 - S.armStiffness);
    for (let i = 1, n = boogieA > 0.05 ? 9 : 5; i < n; i++) {
      tmp.copy(pos[0]).addScaledVector(out, i * seg);
      pos[i].lerp(tmp, stiff / (boogieA > 0.05 ? Math.sqrt(i) : i));
    }

    const center = body.getWorldPosition(_c);
    for (let it = 0; it < 14; it++) {
      for (let i = 1; i < ARM_N; i++) {
        const a = pos[i - 1], b = pos[i];
        tmp.subVectors(b, a);
        const d = tmp.length() || 1e-6;
        const diff = (d - seg) / d;
        if (i === 1) b.addScaledVector(tmp, -diff);
        else { a.addScaledVector(tmp, diff * 0.5); b.addScaledVector(tmp, -diff * 0.5); }
      }
      for (let i = 2; i < ARM_N; i++) {
        const p = pos[i];
        // keep out of the (jiggling) bean
        const ly = THREE.MathUtils.clamp(p.y - center.y, -LEN / 2, LEN / 2);
        const w = yNorm(ly) ** 2;

    this.hand.scale.setScalar((S.armThickness / 0.1) * (1 + 0.6 * limbPulse(this.shoulderBase, len, 1)));

}

// screaming (Q): eyes clenched, mouth huge, body trembling, arms thrown up, camera shake
let screamT = 0, shake = 0;
const shakeOff = new THREE.Vector3();
function scream() {
  if (screamT > 0.3) return;
  screamT = 1.4;
  squashV += 3 * S.jiggle;
  sfx.scream();
  arms.forEach((a) => a.pos.forEach((p, i) => { a.prev[i].y = p.y - 0.09 * (i / ARM_N); }));
}

function poke(obj, dir, point) {
  tmp.set(dir.x, 0, dir.z).normalize();
  lagV.addScaledVector(tmp, 2.2 * S.jiggle);
  squashV -= 2 * S.jiggle;
  squint = 0.35;
  mouthOpen = 2;
  sfx.pop();
  sfx.poke();
  const arm = arms.find((a) => a.limb.mesh === obj || a.hand.getObjectById(obj.id));
  // ripple starts where you poked the bean (or at the shoulder of a poked arm)
  const origin = arm ? arm.shoulderBase.clone() : body.worldToLocal(point.clone());
  ripples.push({ p: origin, t0: t, amp: 0.14 * R * S.jiggle });
  if (ripples.length > 4) ripples.shift();
  // poked an arm or hand? flick that noodle up
  if (arm) arm.pos.forEach((p, i) => { const k = i / ARM_N; arm.prev[i].set(p.x - tmp.x * 0.06 * k, p.y - 0.12 * k, p.z - tmp.z * 0.06 * k); });
}
const SPEED = 2.4, RUN = 5.6;
const clock = new THREE.Clock();

let blinkT = 0, nextBlink = 2.5;
function blinkPhase(dt) {
  blinkT += dt;
  if (blinkT > nextBlink) { blinkT = 0; nextBlink = rand(2, 5); }
  const k = blinkT / 0.14;
  return k < 1 ? Math.max(0.15, Math.abs(1 - 2 * k)) : 1;
}

function update(dt) {
  t += dt;

  move.set(0, 0, 0);
  const kx = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const kz = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  if (fall.t >= 0 || intro.active) { /* sprawled or still dropping in: no steering */ }
  else if (kx || kz) {
    goal = null; marker.visible = false;
    const fwd = camera.getWorldDirection(tmp).setY(0).normalize();
    const right = tmp2.crossVectors(fwd, camera.up).normalize();
    move.addScaledVector(fwd, kz).addScaledVector(right, kx).normalize();
  } else if (goal) {
    move.subVectors(goal, guy.position).setY(0);
    const d = move.length();
    if (d < 0.3) { goal = null; marker.visible = false; move.set(0, 0, 0); }
    else move.multiplyScalar(Math.min(1, d / 1.2) / d);
  }

  prevVel.copy(vel);
  const running = keys.has('ShiftLeft') || keys.has('ShiftRight');
  vel.lerp(move.multiplyScalar(running ? RUN : SPEED), 1 - Math.exp(-dt * (fall.t >= 0 ? 2.2 : 6))); // a fall slides to a stop
  // wind holes: getting close shoves him outward, with gusts swirling him about (feet stay down)
  for (const v of vents) {
    const dx = guy.position.x - v.g.position.x, dz = guy.position.z - v.g.position.z, d = Math.hypot(dx, dz);
    const reach = VENT_R * 1.7;
    if (d > reach) continue;
    const k = (1 - d / reach) * v.s, push = 26 * k, gust = 14 * k;
    const nx = d > 0.05 ? dx / d : Math.cos(t * 3), nz = d > 0.05 ? dz / d : Math.sin(t * 3);
    vel.x += (nx * push + Math.sin(t * 5.3 + v.g.position.x) * gust) * dt;
    vel.z += (nz * push + Math.cos(t * 4.1 + v.g.position.z) * gust) * dt;
  }
  acc.subVectors(vel, prevVel).divideScalar(dt);
  lastPos.copy(guy.position);
  guy.position.addScaledVector(vel, dt);

  const speed = vel.length();
  if (speed > 0.05) {
    let dh = Math.atan2(vel.x, vel.z) - heading;
    dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    heading += dh * (1 - Math.exp(-dt * 8));
  }
  guy.rotation.y = heading;

  if (crouch >= 0) { crouch -= dt; if (crouch < 0) launch(7.5); }
  if (!intro.waiting && intro.shadow < 1) intro.shadow = Math.min(1, intro.shadow + dt / 0.7);
  ground.material.opacity = 0.1 * intro.shadow;
  if (airborne && !intro.waiting) {
    jumpV -= 24 * dt;
    jumpY += jumpV * dt;
    if (jumpY <= 0) {
      squashV -= Math.min(4, -jumpV * 0.35) * S.jiggle;
      if (!intro.active) sfx.land(-jumpV);
      jumpY = 0; jumpV = 0; airborne = false;
      if (intro.active) introLanding();
    }
  }
  // holes: feet stay planted, but the bean gets buffeted while he stands in the updraft
  const over = ventLift(guy.position.x, 0, guy.position.z);
  windA += (Math.min(1, over * 1.6) - windA) * (1 - Math.exp(-dt * 4));
  guy.position.y = jumpY;
  if (windA > 0.02) {
    lagV.x += (Math.random() - 0.5) * windA * 40 * dt * S.jiggle;
    lagV.z += (Math.random() - 0.5) * windA * 40 * dt * S.jiggle;
    squashV += (Math.random() - 0.5) * windA * 60 * dt * S.jiggle;
  }
  let near = 0;
  for (const v of vents) near = Math.max(near, clamp01(1 - Math.hypot(guy.position.x - v.g.position.x, guy.position.z - v.g.position.z) / 5));
  updateWindSound(near, windA);

  // scream: trembling + shake
  if (screamT > 0) {
    screamT -= dt;
    const k = clamp01(screamT / 0.4);
    lagV.x += (Math.random() - 0.5) * 120 * dt * k;
    lagV.z += (Math.random() - 0.5) * 120 * dt * k;
    squashV += (0.1 - squash) * 60 * dt * k;
    shake = Math.max(shake, 0.12 * k);
    squint = Math.max(squint, 0.05);
  }
  shake *= Math.exp(-dt * 6);
  airT += ((airborne ? 1 : 0) - airT) * (1 - Math.exp(-dt * 12));

  updateFall(dt);
  const amt = Math.min(1, speed / SPEED) * (1 - airT) * (1 - clamp01(fallA));

  if ((kx || kz || goal) && dancing) { dancing = false; sfx.danceOff(); }
  danceA += ((dancing ? 1 : 0) - danceA) * (1 - Math.exp(-dt * 5));
  updateMusicLevel(dancing);
  boogieA = danceStyle === 'boogie' ? danceA : 0;
  twirlA = danceStyle === 'twirl' ? danceA : 0;
  if (dancing) {
    danceT += dt;
    const beat = danceT * 1.93, bi = Math.floor(beat); // ~116 bpm
    danceBeat = beat * Math.PI;
    if (bi !== lastBeat) {
      lastBeat = bi;
      sfx.beat(bi, danceStyle);
      if (danceStyle === 'boogie') {
        squashV -= 1.4 * S.jiggle;
        const side = bi % 2 ? 1 : -1; // shimmy the jiggle left / right in body space
        lagV.x += Math.cos(heading) * side * 1.4 * S.jiggle;
        lagV.z -= Math.sin(heading) * side * 1.4 * S.jiggle;
        if (bi % 4 === 3 && !airborne) launch(4.2);
      } else if (danceStyle === 'twirl') {
        squashV -= 0.8 * S.jiggle;
        if (bi % 4 === 0) { sfx.whoosh(); if (!airborne) launch(3.6); } // new bar: hop and reverse
      } else { // pogo
        if (!airborne) launch(5.2);
        if (bi % 2) pogoTurn += (Math.floor(bi / 8) % 2 ? -1 : 1) * Math.PI / 2; // turn one way for a while, then back
      }
    }
  }
  const spinDir = Math.floor(danceT * 1.93 / 4) % 2 ? -1 : 1;
  spinVel += ((dancing && danceStyle === 'twirl' ? spinDir * 9 : 0) - spinVel) * (1 - Math.exp(-dt * 2.5));
  heading += spinVel * dt;
  const turnStep = pogoTurn * (1 - Math.exp(-dt * 12)); // snap through each quarter-turn mid-air
  heading += turnStep; pogoTurn -= turnStep;
  updateIdle(dt, speed < 0.1 && !goal && !dancing && !airborne && crouch < 0 && screamT <= 0 && windA < 0.05 && fall.t < 0);
  guy.rotation.y = heading + Math.sin(danceBeat * 0.5) * 0.5 * boogieA + idle.turn;
  // running: cartoon-fast little legs
  const runA = clamp01((speed - SPEED) / (RUN - SPEED)) * (1 - airT);
  phase += dt * (4 + speed * 4.5 + runA * 16);

  // bean physics: top lags behind acceleration (and wobbles when he stops), squash on each footfall
  lagV.addScaledVector(lagW, -90 * dt).multiplyScalar(Math.exp(-7 * dt)).addScaledVector(acc, -S.jiggle * dt);
  lagW.addScaledVector(lagV, dt).clampLength(0, 0.45 * HALF_H);
  hc = Math.cos(-heading); hs = Math.sin(-heading);
  lagL.set(lagW.x * hc + lagW.z * hs, 0, -lagW.x * hs + lagW.z * hc);
  const step = Math.floor(phase / Math.PI);
  if (step !== lastStep) {
    squashV -= 0.9 * amt * (1 - runA * 0.6) * S.jiggle;
    lastStep = step;
    if (amt > 0.3) sfx.step(runA > 0.5);
    if (runA > 0.7 && fall.t < 0 && !airborne) {
      const ax = guy.position.x + Math.sin(heading) * 0.45, az = guy.position.z + Math.cos(heading) * 0.45;
      const flowerAhead = flowers.some((f) => f.s > 0.5 && Math.hypot(f.g.position.x - ax, f.g.position.z - az) < 0.35);
      if (flowerAhead || Math.random() < 0.006) trip();
    }
    if (runA > 0.5) { // puff behind the foot that just landed
      const l = legs[(step % 2) * 3 % 4];
      tmp.set(l.x, 0, l.z).applyAxisAngle(THREE.Object3D.DEFAULT_UP, guy.rotation.y).add(guy.position);
      spawnPuff(tmp.x, tmp.z);
    }
  }
  const breathe = Math.sin(t * 2) * 0.018 * (1 - amt);
  const stretch = airborne ? THREE.MathUtils.clamp(jumpV * 0.012, -0.06, 0.1) : 0;
  squashV += (-180 * (squash - breathe - stretch - idle.stretch)) * dt;
  squashV *= Math.exp(-9 * dt);
  squash = THREE.MathUtils.clamp(squash + squashV * dt, -0.25, 0.25);

  body.position.y = BODY_Y + Math.abs(Math.sin(phase)) * 0.05 * amt * (1 - runA * 0.4) + Math.abs(Math.sin(danceBeat)) * 0.07 * boogieA;
  body.rotation.z = Math.sin(phase) * 0.07 * amt * (1 - runA * 0.5) + Math.sin(danceBeat) * 0.14 * boogieA;
  // running: the legs outpace the bean, so it leans back and gets dragged along
  body.rotation.x = -runA * 0.24;
  body.rotation.z -= spinVel * 0.012; // twirl: lean out from the spin
  // tripping: pivot forward onto his face, dropping to lie on the ground just ahead of his feet
  body.rotation.x += fallA * 1.45;
  body.rotation.z += clamp01(fallA) * fall.roll;
  body.position.y = THREE.MathUtils.lerp(body.position.y, R * 1.08, clamp01(fallA));
  body.position.z = fallA * HALF_H * 0.55;
  while (ripples.length && t - ripples[0].t0 > 3) ripples.shift();
  deformBean();
  const open = blinkPhase(dt);
  squint -= dt;
  beanMat.uniforms.uBlink.value = squint > 0 ? 0.12 : open * idle.eyes;
  // mouth drops open when poked or airborne, then eases shut
  const screaming = screamT > 0 ? clamp01(screamT / 0.3) : 0;
  mouthOpen += ((airborne ? 1.5 : 1) + windA * 0.8 + screaming * 3.2 + idle.mouth + clamp01(fallA) * 1.6 - mouthOpen) * (1 - Math.exp(-dt * (screaming ? 18 : 6)));
  beanMat.uniforms.uOpen.value = mouthOpen;
  beanMat.uniforms.uWide.value = 1 + screaming * 0.35;
  body.updateMatrix();

  for (const l of legs) {
    const sn = Math.sin(phase + l.off), cs = Math.cos(phase + l.off);
    const [hip, knee, foot] = l.pts;
    hip.copy(l.hip).applyMatrix4(body.matrix);
    foot.set(l.x, S.legThickness + Math.max(0, sn) * 0.32 * LEG_H * amt * (1 + runA * 0.5) + airT * 0.3 * LEG_H
      + boogieA * Math.max(0, Math.sin(danceBeat + (l.sx > 0 ? 0 : Math.PI))) * 0.35 * LEG_H
      + twirlA * Math.max(0, Math.sin(danceBeat * 2 + l.off)) * 0.15 * LEG_H + (l === legs[1] ? idle.tap : 0), l.z + cs * 0.14 * amt * (1 + runA * 1.2));
    knee.set(l.x * 1.0, foot.y + (hip.y - foot.y) * 0.42, foot.z + 0.03 + cs * 0.04 * amt * (1 + runA * 2));
    if (fallA > 0) { // sprawled: legs trail out behind, kicking
      const k = clamp01(fallA);
      tmp.copy(hip).add(tmp2.set(l.x * 0.25, -0.12 + Math.sin(t * 16 + l.off) * 0.12 * k, -LEG_H * 0.8));
      foot.lerp(tmp, k);
      tmp.lerpVectors(hip, foot, 0.5);
      tmp.y += 0.1;
      knee.lerp(tmp, k);
    }
    const legLen = LEG_H + 0.22;
    l.limb.set(l.pts, ripples.length ? (u) => limbPulse(l.hip, legLen, u) : null);
    l.foot.position.copy(foot);
    l.foot.scale.setScalar(S.legThickness * (1 + 0.6 * limbPulse(l.hip, legLen, 1)));
  }

  guy.updateMatrixWorld(true);
  for (let i = 0; i < 3; i++) arms.forEach((a) => a.step(dt / 3));

  // camera + shadow follow
  tmp.subVectors(guy.position, lastPos).setY(0); // camera doesn't bob with jumps
  camera.position.add(tmp);
  controls.target.add(tmp);
  sun.position.set(guy.position.x + 4, 12, guy.position.z + 6);
  sun.target.position.copy(guy.position).setY(0);
  CURVE_C.value.set(guy.position.x, guy.position.z);
  groundFill.position.set(guy.position.x, 0, guy.position.z);
  ground.position.copy(groundFill.position);

  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt * 2;
    if (p.life <= 0) { p.m.visible = false; continue; }
    p.m.position.addScaledVector(p.vel, dt);
    p.m.scale.setScalar(0.08 + (1 - p.life) * 0.22);
    p.m.material.opacity = p.life * 0.8;
  }

  const moveDir = vel.lengthSq() > 0.5 ? vel : null;
  for (const v of vents) {
    if (Math.hypot(v.g.position.x - guy.position.x, v.g.position.z - guy.position.z) > VENT_GONE) replantVent(v, guy.position, moveDir);
    v.sv += (-140 * (v.s - 1)) * dt; v.sv *= Math.exp(-7 * dt); v.s += v.sv * dt;
    v.g.scale.setScalar(Math.max(0.001, v.s));
    // slide the pit floor toward the camera; less wall shows the more top-down we look
    tmp.subVectors(v.g.position, camera.position);
    const horiz = Math.hypot(tmp.x, tmp.z) / (tmp.length() || 1);
    v.pit.material.uniforms.uOff.value.set(-tmp.x, -tmp.z).normalize().multiplyScalar(VENT_R * PIT_DEPTH * horiz);
    for (const mo of v.motes) { // squares riding the updraft
      mo.ph += dt * mo.speed;
      if (mo.ph >= 1) { mo.ph -= 1; respawnMote(mo); }
      mo.m.position.set(mo.x + Math.sin(t * 2 + mo.sway) * 0.08 * mo.ph, 0.1 + mo.ph * 3.2, mo.z + Math.cos(t * 1.7 + mo.sway) * 0.08 * mo.ph);
      mo.m.quaternion.copy(camera.quaternion);
      mo.m.rotateZ(mo.spin * mo.ph);
      mo.m.scale.setScalar(mo.size * (1 - 0.6 * mo.ph));
      mo.m.material.opacity = Math.min(1, mo.ph * 6) * (1 - mo.ph);
    }
  }


  // flowers sway, and boing out of the way of the body and the dragging hands
  for (const f of flowers) {
    if (Math.hypot(f.g.position.x - guy.position.x, f.g.position.z - guy.position.z) > FLOWER_GONE) replant(f, guy.position, moveDir);
    f.sv += (-140 * (f.s - 1)) * dt; f.sv *= Math.exp(-7 * dt); f.s += f.sv * dt;
    f.g.scale.setScalar(Math.max(0.001, f.s));
    let px = 0, pz = 0;
    for (const [src, reach] of [[guy.position, R + 0.9], [arms[0].hand.position, 0.6], [arms[1].hand.position, 0.6]]) {
      const dx = f.g.position.x - src.x, dz = f.g.position.z - src.z, d = Math.hypot(dx, dz) || 1;
      const k = clamp01(1 - d / reach) * 0.9;
      px += (dx / d) * k; pz += (dz / d) * k;
    }
    const push = Math.hypot(px, pz);
    if (push > 0.35 && !f.pushed) { f.pushed = true; sfx.boing(); } else if (push < 0.1) f.pushed = false;
    const sway = Math.sin(t * 1.3 + f.ph) * 0.04;
    f.vx += (-120 * (f.tx - px - sway)) * dt; f.vx *= Math.exp(-6 * dt); f.tx += f.vx * dt;
    f.vz += (-120 * (f.tz - pz)) * dt; f.vz *= Math.exp(-6 * dt); f.tz += f.vz * dt;
    f.g.rotation.set(f.tz, 0, -f.tx);
  }
  if (marker.visible) marker.scale.setScalar(THREE.MathUtils.lerp(marker.scale.x, 1, 1 - Math.exp(-dt * 10)));
}

startIntro();

renderer.setAnimationLoop(() => {
  const dt = THREE.MathUtils.clamp(clock.getDelta(), 1 / 240, 1 / 30);
  update(dt);
  arms.forEach((a) => a.render());
  controls.update();
  shakeOff.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake);
  camera.position.add(shakeOff);
  renderer.render(scene, camera);
  camera.position.sub(shakeOff);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
